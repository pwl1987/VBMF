name: CI Runner Rust Pin

# Trusted infrastructure maintenance only. This is deliberately separate from
# ci-infra-probe.yml, whose read-only/no-sudo contract remains unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runner-rust-pin
  cancel-in-progress: false

jobs:
  pin-rust:
    name: pin-rust-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [a, b]
    runs-on: [self-hosted, linux, x64, vbmf, vbmf-general]
    timeout-minutes: 15
    steps:
      - name: Fetch reviewed maintenance scripts from exact SHA
        env:
          VBMF_CI_PROXY: ${{ vars.VBMF_CI_PROXY }}
        run: |
          dir="$RUNNER_TEMP/vbmf-ci-maint"
          rm -rf "$dir" && mkdir -p "$dir"
          curl_opts=(--proto '=https' --tlsv1.2 -fL --retry 3 --connect-timeout 15 --max-time 120)
          if [ -n "$VBMF_CI_PROXY" ]; then curl_opts+=(--proxy "$VBMF_CI_PROXY"); fi
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/ci"
          curl "${curl_opts[@]}" "$base/pin-system-rust.sh" -o "$dir/pin-system-rust.sh"
          curl "${curl_opts[@]}" "$base/collect-toolchain.sh" -o "$dir/collect-toolchain.sh"
          chmod +x "$dir/pin-system-rust.sh" "$dir/collect-toolchain.sh"
      - name: Runner identity
        run: |
          echo "runner.name=$RUNNER_NAME"
          hostname
      - name: Require non-interactive maintenance privilege
        run: sudo -n true
      - name: Pin system Rust 1.98.1
        env:
          VBMF_CI_PROXY: ${{ vars.VBMF_CI_PROXY }}
        run: |
          sudo -n env "VBMF_CI_PROXY=$VBMF_CI_PROXY" \
            bash "$RUNNER_TEMP/vbmf-ci-maint/pin-system-rust.sh" --version 1.98.1
      - name: Verify job-visible toolchain
        run: |
          test "$(command -v rustc)" = /usr/local/bin/rustc
          test "$(command -v cargo)" = /usr/local/bin/cargo
          test "$(command -v rustfmt)" = /usr/local/bin/rustfmt
          rustc --version | grep -F 'rustc 1.98.1 '
          cargo --version
          rustfmt --version
      - name: Refresh runner toolchain manifest
        run: bash "$RUNNER_TEMP/vbmf-ci-maint/collect-toolchain.sh" --name "$RUNNER_NAME"
      - name: Cleanup maintenance scripts
        if: always()
        run: rm -rf "$RUNNER_TEMP/vbmf-ci-maint"
