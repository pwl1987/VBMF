name: media-agent CI

# Validates the Rust Media Agent build without needing DeckLink hardware.
# The real FFI build (feature `bmd` / `hardware-test`) produces the
# `media-agent-linux` artifact for BMD acceptance runs.
#
# p06-final-merge-hardening (PR#1 终审整改): 由单一聚合 test job 拆分为粒度化
# required gates — 聚合 check 产生盲区 (hardware-test 回归曾藏身于聚合绿)。
# Branch protection required contexts (与 job `name` 严格一致):
#   rust-format / rust-test-matrix / rust-clippy / session-lifecycle /
#   hardware-test-compile / architecture-portability / gstreamer-build
on:
  push:
    branches: [master, main]
  pull_request:

defaults:
  run:
    working-directory: services/media-agent

jobs:
  # ── rust-format ──────────────────────────────────────────────────────────────
  rust-format:
    name: rust-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check (required)
        run: cargo fmt --all -- --check

  # ── architecture-portability ────────────────────────────────────────────────
  # ARCH-PORTABILITY-01 两层:
  #   - Lint (词法): check_arch_portability.py — 防厂商名称以路径引用回渗受保护层。
  #   - Proof (结构): check_remove_adapters.py — 真实移除 concrete adapters
  #     (blackmagic/gstreamer) 后 cargo check (simulation/mock)。
  #   边界表述: Proof 证明的是 "删除 concrete adapter 后 Domain/Contracts/Runtime 的
  #   指定构建路径仍编译", 非 "整个项目完全 vendor-independent"。
  architecture-portability:
    name: architecture-portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-arch-${{ hashFiles('services/media-agent/Cargo.toml') }}
      - name: Architecture Lint (ARCH-PORTABILITY-01 lexical)
        run: python3 ${{ github.workspace }}/scripts/check_arch_portability.py
      - name: Architecture Proof (remove-adapter compile, P0-5)
        run: python3 ${{ github.workspace }}/scripts/check_remove_adapters.py

  # ── rust-clippy ──────────────────────────────────────────────────────────────
  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('services/media-agent/Cargo.toml') }}
      - name: Clippy (default, -D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (mock, -D warnings)
        run: cargo clippy --all-targets --features mock -- -D warnings
      # bmd/gstreamer 组合 clippy 由盒上 (10.30.15.10) ACCEPTANCE 承担 —
      # CI 无 GStreamer dev / DeckLink SDK, 不重复。

  # ── session-lifecycle ────────────────────────────────────────────────────────
  # P0-7A 门禁: SESSION-RT-01 (全生命周期/失败回滚/double-start-stop 防护) +
  # RESOURCE-RT-01 (并发争抢/容量/冲突/release/expiry/crash cleanup)。
  # 以 mock feature 跑 SessionManager/resource/lease/preflight 全部门禁测试。
  session-lifecycle:
    name: session-lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-session-${{ hashFiles('services/media-agent/Cargo.toml') }}
      - name: Test (mock) — session + resource + lease + preflight gate tests
        run: "cargo test --features mock session:: resource:: lease:: preflight::"

  # ── rust-test-matrix ─────────────────────────────────────────────────────────
  # 编译门禁 (Test A) + 单测: 禁用厂商 feature 后 Domain/Graph/Session/Supervisor/
  # Health/Acceptance 必须仍能独立编译并测试通过 (可替换性权威证明)。
  rust-test-matrix:
    name: rust-test-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('services/media-agent/Cargo.toml') }}
      - name: Build (default)
        env:
          CARGO_TERM_COLOR: always
        run: cargo build
      - name: ARCH-PORTABILITY-01 compile gate — simulation (no vendor adapters)
        run: cargo build --no-default-features --features simulation
      - name: ARCH-PORTABILITY-01 compile gate — mock (no vendor adapters)
        run: cargo build --no-default-features --features mock
      - name: Test (default features)
        run: cargo test
      - name: Test (simulation feature)
        run: cargo test --features simulation
      - name: Test (mock feature) — p06-hi gates (ARCH-BACKEND-01 Mock side + gate assertions)
        run: cargo test --features mock
      - name: Upload media-agent Linux binary (default)
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-linux-default
          path: services/media-agent/target/debug/media-agent

  # ── hardware-test-compile ────────────────────────────────────────────────────
  # Bindgen / FFI contract build (Gate 6/7 INDEPENDENT verification).
  # Builds the `hardware-test` binary (implies `bmd-provider`, NOT gstreamer —
  # feature 交叉路径: 本 job 曾因 Uuid import 门控过窄而回归, 专设 required gate 防再发).
  #
  # NOTE: the SDK header secrets are 30KB each (GitHub secret value limit < full
  # payload, so split into _1/_2). A JOB-level `if: ${{ secrets.X != '' }}` is NOT
  # used because GitHub evaluates that at workflow-load time and chokes on the large
  # secret value (0s "workflow file issue"). Instead the secrets are injected as
  # job-level env and each step is gated with `if: ${{ env.X != '' }}` (evaluated
  # at step time).
  #
  # Provisioning (host with the SDK):
  #   cd <SDK>/Linux/include
  #   find . -name '*.h' -print0 | tar --null -cf - -T - | gzip -9 | base64 -w0 > sdk.b64
  #   # split sdk.b64 into two ~30KB halves sdk_a.b64 / sdk_b.b64
  #   gh secret set DECKLINK_SDK_HEADERS_1 -b"$(cat sdk_a.b64)"
  #   gh secret set DECKLINK_SDK_HEADERS_2 -b"$(cat sdk_b.b64)"
  #   gh secret set DECKLINK_SDK_VERSION -b"16.0.0"
  # CI concatenates both halves, base64-decodes, untars into
  # .github/_private/decklink-sdk (gitignored, cleaned up) and builds
  # `hardware-test`.
  #
  # CI needs NO DeckLink hardware and NO libDeckLinkAPI.so - it only verifies:
  # SDK headers -> bindgen -> generated bindings -> Rust compile.
  # The real link/open against libDeckLinkAPI.so + real enumeration is owned by BMD.
  hardware-test-compile:
    name: hardware-test-compile
    runs-on: ubuntu-latest
    env:
      DECKLINK_SDK_INCLUDE: ${{ github.workspace }}/.github/_private/decklink-sdk
      DECKLINK_SDK_HEADERS_1: ${{ secrets.DECKLINK_SDK_HEADERS_1 }}
      DECKLINK_SDK_HEADERS_2: ${{ secrets.DECKLINK_SDK_HEADERS_2 }}
      DECKLINK_SDK_VERSION: ${{ secrets.DECKLINK_SDK_VERSION }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install libclang (bindgen runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: unpack DeckLink SDK headers from secret
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: |
          mkdir -p "${{ github.workspace }}/.github/_private/decklink-sdk"
          printf '%s%s' "$DECKLINK_SDK_HEADERS_1" "$DECKLINK_SDK_HEADERS_2" | base64 -d | tar -xz -C "${{ github.workspace }}/.github/_private/decklink-sdk"
          echo "DeckLink SDK version: ${DECKLINK_SDK_VERSION:-<unset>}"
      - name: build --features hardware-test (bindgen parse + FFI compile)
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: cargo build --features hardware-test
      - name: debug-upload generated FFI bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decklink-bindings-debug
          path: services/media-agent/target/**/out/bindings.rs
      - name: upload media-agent-linux (hardware-test binary for BMD)
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-linux
          path: services/media-agent/target/debug/media-agent
      - name: cleanup (never persist proprietary SDK assets)
        if: always()
        run: rm -rf "${{ github.workspace }}/.github/_private"

  # ── gstreamer-build ──────────────────────────────────────────────────────────
  # Canonical GStreamer runtime build (MEDIA-RT-01 accept on real BMD).
  # Builds `--features bmd,gstreamer` (NOT hardware-test — mutually exclusive with
  # gstreamer per the compile_error! in main.rs). Needs DeckLink SDK headers
  # (bindgen, same secret as ffi-contract) + GStreamer dev (gstreamer-sys pkg-config).
  # Real device open / first GstBuffer is owned by BMD at runtime
  # (libDeckLinkAPI.so + decklink GStreamer plugin), not by CI.
  gstreamer-build:
    name: gstreamer-build
    runs-on: ubuntu-latest
    env:
      DECKLINK_SDK_INCLUDE: ${{ github.workspace }}/.github/_private/decklink-sdk
      DECKLINK_SDK_HEADERS_1: ${{ secrets.DECKLINK_SDK_HEADERS_1 }}
      DECKLINK_SDK_HEADERS_2: ${{ secrets.DECKLINK_SDK_HEADERS_2 }}
      DECKLINK_SDK_VERSION: ${{ secrets.DECKLINK_SDK_VERSION }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install system deps (GStreamer dev + bindgen + protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config libclang-dev protobuf-compiler
      - name: unpack DeckLink SDK headers from secret
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: |
          mkdir -p "${{ github.workspace }}/.github/_private/decklink-sdk"
          printf '%s%s' "$DECKLINK_SDK_HEADERS_1" "$DECKLINK_SDK_HEADERS_2" | base64 -d | tar -xz -C "${{ github.workspace }}/.github/_private/decklink-sdk"
          echo "DeckLink SDK version: ${DECKLINK_SDK_VERSION:-<unset>}"
      - name: build --features bmd,gstreamer
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: cargo build --features bmd,gstreamer
      - name: upload media-agent-gstreamer-linux
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-gstreamer-linux
          path: services/media-agent/target/debug/media-agent
      - name: cleanup (never persist proprietary SDK assets)
        if: always()
        run: rm -rf "${{ github.workspace }}/.github/_private"
