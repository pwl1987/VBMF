name: media-agent CI

on:
  push:
    branches: [master, main]
  pull_request:

# Gate A (SoT section 10): pure-CI gates, no hardware required.
# This workflow validates the Rust Media Agent skeleton compiles and is formatted.
# BMD hardware acceptance (MEDIA-SEC-01 / MEDIA-RT-01 / FI-08/09) is a SEPARATE
# remote gate and is NOT run here.

jobs:
  test:
    name: Rust media-agent build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media-agent
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/media-agent/Cargo.toml') }}

      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Build (skeleton must compile)
        env:
          CARGO_TERM_COLOR: always
        run: cargo build

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -W warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (simulation feature)
        run: cargo test --features simulation

      - name: Upload media-agent Linux binary (default)
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-linux-default
          path: services/media-agent/target/debug/media-agent
