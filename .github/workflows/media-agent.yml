name: media-agent CI

# Validates the Rust Media Agent build without needing DeckLink hardware.
# The real FFI build (feature `bmd` / `hardware-test`) produces the
# `media-agent-linux` artifact for BMD acceptance runs.
#
# p06-final-merge-hardening (PR#1 终审整改): 由单一聚合 test job 拆分为粒度化
# required gates — 聚合 check 产生盲区 (hardware-test 回归曾藏身于聚合绿)。
# Branch protection required contexts (与 job `name` 严格一致):
#   rust-format / rust-test-matrix / rust-clippy / session-lifecycle /
#   hardware-test-compile / architecture-portability / gstreamer-build
on:
  push:
    branches: [main]
  pull_request:

# P2-B: fork PRs stay on GitHub-hosted runners. P2-C+ may move one required
# job at a time to self-hosted only for trusted push/same-repository PR paths.
# Do not use pull_request_target to execute PR code.
permissions:
  contents: read

concurrency:
  group: media-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/media-agent

jobs:
  # ── rust-format ──────────────────────────────────────────────────────────────
  rust-format:
    name: rust-format
    # P2-C4: conditional runner. Trusted events (canonical main push /
    # same-repository PR) use the pinned self-hosted vbmf-general pool; fork
    # PRs always stay GitHub-hosted (§15.6 frozen boundary). Push events carry
    # no pull_request payload, so !github.event.pull_request.head.repo.fork
    # evaluates true → trusted.
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","Linux","X64","vbmf","vbmf-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted (fork) path only: install exact 1.98.1 — same version as
      # the system pin so both sides of the boundary judge formatting with
      # identical rustfmt (§15.7). Self-hosted path installs nothing.
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format check (required)
        # §3.6 RCA: under the vbmf-ci service account the rustup proxies only
        # resolve the system pin with explicit RUSTUP_HOME/CARGO_HOME and no
        # caller RUSTUP_TOOLCHAIN — same call contract as verify-system-rust.sh
        # V2-V4. GitHub-hosted path keeps the dtolnay-provided env untouched.
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            export RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo
            unset RUSTUP_TOOLCHAIN
          fi
          cargo fmt --all -- --check

  # ── architecture-portability ────────────────────────────────────────────────
  # ARCH-PORTABILITY-01 两层:
  #   - Lint (词法): check_arch_portability.py — 防厂商名称以路径引用回渗受保护层。
  #   - Proof (结构): check_remove_adapters.py — 真实移除 concrete adapters
  #     (blackmagic/gstreamer) 后 cargo check (simulation/mock)。
  #   边界表述: Proof 证明的是 "删除 concrete adapter 后 Domain/Contracts/Runtime 的
  #   指定构建路径仍编译", 非 "整个项目完全 vendor-independent"。
  architecture-portability:
    name: architecture-portability
    # P2-E2: conditional runner (same boundary as P2-C4/P2-D/P2-E1). Trusted
    # events use the pinned self-hosted vbmf-general pool; fork PRs always
    # stay GitHub-hosted (§15.6 frozen boundary).
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","Linux","X64","vbmf","vbmf-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted (fork) path only, kept as-is (no toolchain pin): the
      # lint is lexical and the proof asserts "compiles without vendor
      # adapters" — neither is patch-version sensitive (brief D2).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-arch-${{ hashFiles('services/media-agent/Cargo.toml') }}
      # Lint is pure python3 (host interpreter, parity-verified on both
      # runners) — no env fork needed.
      - name: Architecture Lint (ARCH-PORTABILITY-01 lexical)
        run: python3 ${{ github.workspace }}/scripts/check_arch_portability.py
      # Self-hosted: the proof script runs `cargo check` via subprocess in a
      # tmp crate copy, inheriting this step's env — explicit Rust env
      # contract (§3.6 RCA) + persistent dirs outside the checkout
      # (target-arch separate from target-clippy/target-session; brief D3).
      - name: Architecture Proof (remove-adapter compile, P0-5)
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            export RUSTUP_HOME=/usr/local/rustup
            export CARGO_HOME="${GITHUB_WORKSPACE%/*}/.cargo-home"
            export CARGO_TARGET_DIR="${GITHUB_WORKSPACE%/*}/target-arch"
            unset RUSTUP_TOOLCHAIN
            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          fi
          python3 ${{ github.workspace }}/scripts/check_remove_adapters.py

  # ── rust-clippy ──────────────────────────────────────────────────────────────
  rust-clippy:
    name: rust-clippy
    # P2-D: conditional runner (same boundary as P2-C4 rust-format). Trusted
    # events (canonical main push / same-repository PR) use the pinned
    # self-hosted vbmf-general pool; fork PRs always stay GitHub-hosted
    # (§15.6 frozen boundary).
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","Linux","X64","vbmf","vbmf-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted (fork) path only: install exact 1.98.1 — same version
      # as the system pin so both sides judge lint with identical clippy
      # (§15.7). Self-hosted path installs nothing (system pin + clippy).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('services/media-agent/Cargo.toml') }}
      # Self-hosted: /usr/local/cargo is root-only (§3.6 RCA) and
      # actions/checkout clean removes untracked files, so the writable
      # CARGO_HOME/CARGO_TARGET_DIR live OUTSIDE the checkout dir — they
      # survive cleaning and persist across runs (replaces actions/cache on
      # this side; the flaky runner egress makes cache upload/download the
      # worse trade).
      - name: Clippy (default, -D warnings)
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            export RUSTUP_HOME=/usr/local/rustup
            export CARGO_HOME="${GITHUB_WORKSPACE%/*}/.cargo-home"
            export CARGO_TARGET_DIR="${GITHUB_WORKSPACE%/*}/target-clippy"
            unset RUSTUP_TOOLCHAIN
            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          fi
          cargo clippy --all-targets -- -D warnings
      - name: Clippy (mock, -D warnings)
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            export RUSTUP_HOME=/usr/local/rustup
            export CARGO_HOME="${GITHUB_WORKSPACE%/*}/.cargo-home"
            export CARGO_TARGET_DIR="${GITHUB_WORKSPACE%/*}/target-clippy"
            unset RUSTUP_TOOLCHAIN
            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          fi
          cargo clippy --all-targets --features mock -- -D warnings
      # bmd/gstreamer 组合 clippy 由盒上 (10.30.15.10) ACCEPTANCE 承担 —
      # CI 无 GStreamer dev / DeckLink SDK, 不重复。

  # ── session-lifecycle ────────────────────────────────────────────────────────
  # P0-7A 门禁: SESSION-RT-01 (全生命周期/失败回滚/double-start-stop 防护) +
  # RESOURCE-RT-01 (并发争抢/容量/冲突/release/expiry/crash cleanup)。
  # 以 mock feature 跑 SessionManager/resource/lease/preflight 全部门禁测试。
  session-lifecycle:
    name: session-lifecycle
    # P2-E1: conditional runner (same boundary as P2-C4 rust-format / P2-D
    # rust-clippy). Trusted events (canonical main push / same-repository PR)
    # use the pinned self-hosted vbmf-general pool; fork PRs always stay
    # GitHub-hosted (§15.6 frozen boundary).
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","Linux","X64","vbmf","vbmf-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted (fork) path only. Kept as-is (no toolchain pin): this
      # job's test assertions do not depend on the exact rustc patch version
      # (unlike rust-format/rust-clippy), and P2-E1 does not change fork-path
      # semantics (brief D2).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-session-${{ hashFiles('services/media-agent/Cargo.toml') }}
      # Self-hosted: /usr/local/cargo is root-only (§3.6 RCA) and
      # actions/checkout clean removes untracked files, so the writable
      # CARGO_HOME/CARGO_TARGET_DIR live OUTSIDE the checkout dir. The
      # target dir is separate from target-clippy (P2-D): clippy and test
      # builds use different flags and would invalidate each other's cache
      # in a shared dir (brief D3).
      - name: Test (mock) — session + resource + lease + preflight gate tests
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            export RUSTUP_HOME=/usr/local/rustup
            export CARGO_HOME="${GITHUB_WORKSPACE%/*}/.cargo-home"
            export CARGO_TARGET_DIR="${GITHUB_WORKSPACE%/*}/target-session"
            unset RUSTUP_TOOLCHAIN
            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          fi
          cargo test --features mock session::
          cargo test --features mock resource::
          cargo test --features mock lease::
          cargo test --features mock preflight::

  # ── rust-test-matrix ─────────────────────────────────────────────────────────
  # 编译门禁 (Test A) + 单测: 禁用厂商 feature 后 Domain/Graph/Session/Supervisor/
  # Health/Acceptance 必须仍能独立编译并测试通过 (可替换性权威证明)。
  rust-test-matrix:
    name: rust-test-matrix
    # P2-E3: conditional runner (same boundary as P2-C4/P2-D/P2-E1/P2-E2) —
    # last required job migrating to the general self-hosted pool.
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","Linux","X64","vbmf","vbmf-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted (fork) path only, kept as-is (no toolchain pin):
      # build/test assertions are not patch-version sensitive (brief D2).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('services/media-agent/Cargo.toml') }}
      # Self-hosted env prep (brief D4): one step writes the §3.6 RCA contract
      # into GITHUB_ENV so every subsequent cargo step inherits it. Fail-closed
      # on a caller-provided RUSTUP_TOOLCHAIN (GITHUB_ENV cannot unset it).
      # Persistent dirs live outside the checkout dir (brief D3), shared by
      # this job's 6 cargo steps — same single-target semantics as the
      # GitHub-hosted path.
      - name: Rust env (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "caller RUSTUP_TOOLCHAIN present; refusing" >&2
            exit 1
          fi
          ws_parent="$(dirname "$GITHUB_WORKSPACE")"
          mkdir -p "$ws_parent/.cargo-home" "$ws_parent/target-testmatrix"
          echo "RUSTUP_HOME=/usr/local/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$ws_parent/.cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$ws_parent/target-testmatrix" >> "$GITHUB_ENV"
      - name: Build (default)
        env:
          CARGO_TERM_COLOR: always
        run: cargo build
      - name: ARCH-PORTABILITY-01 compile gate — simulation (no vendor adapters)
        run: cargo build --no-default-features --features simulation
      - name: ARCH-PORTABILITY-01 compile gate — mock (no vendor adapters)
        run: cargo build --no-default-features --features mock
      - name: Test (default features)
        run: cargo test
      - name: Test (simulation feature)
        run: cargo test --features simulation
      - name: Test (mock feature) — p06-hi gates (ARCH-BACKEND-01 Mock side + gate assertions)
        run: cargo test --features mock
      # CARGO_TARGET_DIR redirect moves the binary outside the checkout on
      # the self-hosted side, and upload-artifact v4 rejects '..' in path
      # patterns — copy the binary into the workspace first (brief D5).
      - name: Stage binary for upload (self-hosted)
        if: runner.environment == 'self-hosted'
        run: cp "$CARGO_TARGET_DIR/debug/media-agent" "$GITHUB_WORKSPACE/media-agent-linux-default-bin"
      # Upload goes through the runner agent channel, not git egress.
      - name: Upload media-agent Linux binary (default)
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-linux-default
          path: ${{ runner.environment == 'self-hosted' && 'media-agent-linux-default-bin' || 'services/media-agent/target/debug/media-agent' }}

  # ── hardware-test-compile ────────────────────────────────────────────────────
  # Bindgen / FFI contract build (Gate 6/7 INDEPENDENT verification).
  # Builds the `hardware-test` binary (implies `bmd-provider`, NOT gstreamer —
  # feature 交叉路径: 本 job 曾因 Uuid import 门控过窄而回归, 专设 required gate 防再发).
  #
  # NOTE: the SDK header secrets are 30KB each (GitHub secret value limit < full
  # payload, so split into _1/_2). A JOB-level `if: ${{ secrets.X != '' }}` is NOT
  # used because GitHub evaluates that at workflow-load time and chokes on the large
  # secret value (0s "workflow file issue"). Instead the secrets are injected as
  # job-level env and each step is gated with `if: ${{ env.X != '' }}` (evaluated
  # at step time).
  #
  # Provisioning (host with the SDK):
  #   cd <SDK>/Linux/include
  #   find . -name '*.h' -print0 | tar --null -cf - -T - | gzip -9 | base64 -w0 > sdk.b64
  #   # split sdk.b64 into two ~30KB halves sdk_a.b64 / sdk_b.b64
  #   gh secret set DECKLINK_SDK_HEADERS_1 -b"$(cat sdk_a.b64)"
  #   gh secret set DECKLINK_SDK_HEADERS_2 -b"$(cat sdk_b.b64)"
  #   gh secret set DECKLINK_SDK_VERSION -b"16.0.0"
  # CI concatenates both halves, base64-decodes, untars into
  # .github/_private/decklink-sdk (gitignored, cleaned up) and builds
  # `hardware-test`.
  #
  # CI needs NO DeckLink hardware and NO libDeckLinkAPI.so - it only verifies:
  # SDK headers -> bindgen -> generated bindings -> Rust compile.
  # The real link/open against libDeckLinkAPI.so + real enumeration is owned by BMD.
  hardware-test-compile:
    name: hardware-test-compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DECKLINK_SDK_INCLUDE: ${{ github.workspace }}/.github/_private/decklink-sdk
      DECKLINK_SDK_HEADERS_1: ${{ secrets.DECKLINK_SDK_HEADERS_1 }}
      DECKLINK_SDK_HEADERS_2: ${{ secrets.DECKLINK_SDK_HEADERS_2 }}
      DECKLINK_SDK_VERSION: ${{ secrets.DECKLINK_SDK_VERSION }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install libclang (bindgen runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: unpack DeckLink SDK headers from secret
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: |
          mkdir -p "${{ github.workspace }}/.github/_private/decklink-sdk"
          printf '%s%s' "$DECKLINK_SDK_HEADERS_1" "$DECKLINK_SDK_HEADERS_2" | base64 -d | tar -xz -C "${{ github.workspace }}/.github/_private/decklink-sdk"
          echo "DeckLink SDK version: ${DECKLINK_SDK_VERSION:-<unset>}"
      - name: build --features hardware-test (bindgen parse + FFI compile)
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: cargo build --features hardware-test
      - name: debug-upload generated FFI bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decklink-bindings-debug
          path: services/media-agent/target/**/out/bindings.rs
      - name: upload media-agent-linux (hardware-test binary for BMD)
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-linux
          path: services/media-agent/target/debug/media-agent
      - name: cleanup (never persist proprietary SDK assets)
        if: always()
        run: rm -rf "${{ github.workspace }}/.github/_private"

  # ── gstreamer-build ──────────────────────────────────────────────────────────
  # Canonical GStreamer runtime build (MEDIA-RT-01 accept on real BMD).
  # Builds `--features bmd,gstreamer` (NOT hardware-test — mutually exclusive with
  # gstreamer per the compile_error! in main.rs). Needs DeckLink SDK headers
  # (bindgen, same secret as ffi-contract) + GStreamer dev (gstreamer-sys pkg-config).
  # Real device open / first GstBuffer is owned by BMD at runtime
  # (libDeckLinkAPI.so + decklink GStreamer plugin), not by CI.
  gstreamer-build:
    name: gstreamer-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DECKLINK_SDK_INCLUDE: ${{ github.workspace }}/.github/_private/decklink-sdk
      DECKLINK_SDK_HEADERS_1: ${{ secrets.DECKLINK_SDK_HEADERS_1 }}
      DECKLINK_SDK_HEADERS_2: ${{ secrets.DECKLINK_SDK_HEADERS_2 }}
      DECKLINK_SDK_VERSION: ${{ secrets.DECKLINK_SDK_VERSION }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install system deps (GStreamer dev + bindgen + protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config libclang-dev protobuf-compiler
      - name: unpack DeckLink SDK headers from secret
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: |
          mkdir -p "${{ github.workspace }}/.github/_private/decklink-sdk"
          printf '%s%s' "$DECKLINK_SDK_HEADERS_1" "$DECKLINK_SDK_HEADERS_2" | base64 -d | tar -xz -C "${{ github.workspace }}/.github/_private/decklink-sdk"
          echo "DeckLink SDK version: ${DECKLINK_SDK_VERSION:-<unset>}"
      - name: build --features bmd,gstreamer
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        run: cargo build --features bmd,gstreamer
      - name: upload media-agent-gstreamer-linux
        if: ${{ env.DECKLINK_SDK_HEADERS_1 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-gstreamer-linux
          path: services/media-agent/target/debug/media-agent
      - name: cleanup (never persist proprietary SDK assets)
        if: always()
        run: rm -rf "${{ github.workspace }}/.github/_private"
