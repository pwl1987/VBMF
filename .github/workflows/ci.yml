name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Gate A (SoT §10): pure-CI gates, no hardware required.
# This workflow validates the Rust Media Agent skeleton compiles and is formatted.
# BMD hardware acceptance (MEDIA-SEC-01 / MEDIA-RT-01 / FI-08/09) is a SEPARATE
# remote gate and is NOT run here.

jobs:
  rust:
    name: Rust media-agent build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media-agent
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/media-agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/media-agent/Cargo.toml') }}

      # Non-blocking: local/BMD have no cargo to pre-fmt; format nits shouldn't
      # block the compile gate. Fix formatting when a cargo env is available.
      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      # Hard gate: skeleton MUST compile. This closes the "unverified skeleton"
      # gap (local/BMD have no Rust toolchain; crates.io egress blocked on BMD).
      # Debug build is sufficient as the compile gate for the skeleton; release+lto
      # is deferred until Gate 2 logic lands (keeps CI fast + avoids OOM on runners).
      - name: "Build (Gate - skeleton must compile)"
        env:
          CARGO_TERM_COLOR: always
        run: cargo build

      # Informational for now (skeleton has intentionally-unused decls).
      # Promote to -D warnings once Gate 2 logic lands. Never blocks the gate.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -W warnings

      # Field-test artifact: Linux binary for BMD runc container / host probe.
      # (MEDIA-SEC-01 / Gate 2.2 discovery verification on real DeckLink hardware.)
      - name: Upload media-agent Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: media-agent-linux
          path: services/media-agent/target/debug/media-agent
