# Build supply chain (Gate 6/7).
#
# Default & CI builds use crates.io directly — nothing to edit here.
#
# BMD / air-gapped builds are driven by COMMAND-LINE FLAGS, not by editing this
# file. After `scripts/vendor.sh` populates ./vendor (and you commit ./Cargo.lock):
#
#   cargo build --locked --offline \
#     --config 'source.crates-io.replace-with="vendored-sources"' \
#     --config 'source.vendored-sources.directory="vendor"' \
#     --features bmd
#
# This keeps the offline mode env/command-selected instead of hand-edited, so the
# committed config never needs a manual uncomment to switch build modes.
