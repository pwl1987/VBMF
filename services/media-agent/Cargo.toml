[package]
name = "media-agent"
version = "0.1.0"
edition = "2021"
description = "VBMF Rust Media Agent — Hardware Plane (DeckLink/GStreamer). Control Plane lives in Node/Fastify."

# Gate 2 skeleton: trait/struct shapes ONLY. No business logic yet.
# Interface frozen against SoT §15.2 (MEDIA-02/03/04) + §14 (Node/Rust boundary).

[dependencies]
# Async runtime (supervisor/monitor loops)
tokio = { version = "1", features = ["full"] }
# IPC/transport to Node Fastify (JSON-RPC or gRPC — shape TBD in §14 contract)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
thiserror = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# Time (lease ttl / health timestamps)
chrono = { version = "0.4", features = ["serde"] }
# UUID (lease/device ids)
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Dynamic loading of DeckLink SDK .so (Gate 2.5 FFI smoke; no link-time dep)
libloading = "0.8"
# Canonical ingest runtime: GStreamer 是 SDI ingest executor (Phase 0.6 锁死).
# DeckLink 经 decklinkvideosrc/decklinkaudiosrc 接入 (persistent-id, gint64, 1.22+).
# Feature-gated: 仅 `gstreamer-backend` 构建链接系统 GStreamer; default/simulation/bmd-provider 不拉 GStreamer,
# 因此 CI default + bmd 构建仍可在无 GStreamer 的机器上编译 (真机 BMD 盒需 --features bmd,gstreamer).
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
# P1-4: Bus watch 需要 GLib MainContext/MainLoop 管理 (与 gstreamer 同版本配套).
glib = { version = "0.20", optional = true }

[dev-dependencies]
# Reserved for Gate 2 unit tests (lease state machine, supervisor restart policy)

# ── Build feature model (frozen semantics) ─────────────────────────────────────
# default        : minimal compilable runtime — filesystem discovery only, no SDK,
#                   no hardware, no GStreamer. Plain `cargo build` / CI default target.
# simulation     : mock DeckLink devices for CI / unit tests — NO hardware, NO SDK.
# bmd-provider   : (规范名) compile the REAL DeckLink FFI (bindgen over DeckLinkAPI.h).
#                   `cargo build --features bmd-provider` (needs SDK include + libclang).
#                   (兼容别名 `bmd` 仍存在; 盒上旧命令 `--features bmd,gstreamer` 可用).
# hardware-test  : bmd-provider ⊕ real-hardware test ENTRY — NOT a separate implementation.
#                   It only ADDS verbose Device Registry probes (model/serial/status)
#                   on top of `bmd-provider`. Must always imply `bmd-provider` (enforced below).
# gstreamer-backend: (规范名) compile the REAL GStreamer ingest executor (decklinkvideosrc/audiosrc
#                   persistent-id). Canonical media path (Phase 0.6). Requires system
#                   GStreamer 1.22+ AND the decklink plugin. Orthogonal to bmd-provider; on the
#                   real BMD box the canonical build is `--features bmd-provider,gstreamer-backend`.
#                   SDK 诊断探针仅限 hardware-test; 真机 GStreamer 启动后不得与 canonical
#                   路径同时打开同一块 DeckLink (避免双采/争用).
# Dependency: hardware-test IMPLIES bmd-provider; simulation is
# orthogonal (no-hardware). hardware-test adds only verbose registry probes on top of bmd-provider.
# gstreamer-backend is orthogonal to bmd-provider (discovery FFI) — both needed on real hardware.
# CI builds/tests default + simulation only; BMD owns the real FFI + hardware build.
[features]
default = []
simulation = []
# 规范名 (C1 Phase 0.6):
bmd-provider = ["dep:bindgen"]
gstreamer-backend = ["dep:gstreamer", "dep:gstreamer-app", "dep:glib"]
# 兼容别名: 盒上旧命令 `--features bmd,gstreamer` 仍可用 (Phase 0.6 迁移期).
bmd = ["bmd-provider"]
gstreamer = ["gstreamer-backend"]
hardware-test = ["bmd-provider"]
# mock: C3 Reference Adapter — 纯 Rust Mock Provider/Backend (无 BMD/无 GStreamer),
#        解锁 ARCH-PORTABILITY-01 Test B/C 的 Mock 侧 (架构解耦门禁).
mock = []

[build-dependencies]
# Optional: only pulled when the `bmd-provider` feature is enabled (needs libclang at build time).
# See build.rs — generates src-level FFI bindings from DeckLinkAPI.h on demand.
bindgen = { version = "0.70", optional = true }

[profile.release]
opt-level = 3
lto = true
