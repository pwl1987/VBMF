id: HA-07-001
title: HA-07 ACTIVE HEALTHY + OFFLINE+FAILED absorbed → HEALTHY
gate: G-RUNTIME
reference: HA
fixture_id: F-HA-07-ABSORBED
env_prereq_id: ENV-LAB-01
runner: runners/run_fi_matrix.py
depends_on: [HA-01-001]
timeout: 300
preconditions:
  - "Active source RG HEALTHY"
  - "One standby source OFFLINE+FAILED but system has absorbed (H5)"
actions:
  - step: 1
    do: "Observe failover decision ACTIVE=HEALTHY / OFFLINE+FAILED present"
expected:
  channel_health: "HEALTHY"
  absorbed: true
pass_rule: "channel_health == 'HEALTHY' AND absorbed == true"
negative_case:
  id: HA-07-001-NEG
  do: "OFFLINE+FAILED demotes HEALTHY to DEGRADED"
  expect_fail: "violates H5 (system already absorbed the failure)"
evidence:
  - "evidence/{id}_{run_ts}_ha_state.json"
artifact_naming: "{id}_{run_ts}_{pass|fail}.json"
retry_rule: {max: 0, backoff_s: 0}
abort_rule: {consecutive_fail: 1}
