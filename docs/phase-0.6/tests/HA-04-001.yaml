    do: "Observe failover decision ACTIVE=DEGRADED / STANDBY=(FAILED|OFFLINE)"
expected:
  channel_health: "DEGRADED"
pass_rule: "channel_health == 'DEGRADED'"
negative_case:
  id: HA-04-001-NEG
  do: "Mis-resolved as FAILED (confused with HA-03 all-unavailable)"
  expect_fail: "violates Rule (ACTIVE DEGRADED + STANDBY unavailable → DEGRADED)"
evidence:
  - "evidence/{id}_{run_ts}_ha_state.json"
artifact_naming: "{id}_{run_ts}_{pass|fail}.json"
retry_rule: {max: 0, backoff_s: 0}
abort_rule: {consecutive_fail: 1}
