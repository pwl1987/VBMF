id: HA-04-001
title: HA-04 ACTIVE DEGRADED + STANDBY OFFLINE/FAILED → DEGRADED
gate: G-RUNTIME
reference: HA
fixture_id: F-HA-04-ACTIVE-DEGRADED
env_prereq_id: ENV-LAB-01
runner: runners/run_fi_matrix.py
depends_on: [HA-01-001]
timeout: 300
preconditions:
  - "Active source RG DEGRADED"
  - "Standby source RG OFFLINE+FAILED"
actions:
