id: AC-01-001
title: Network Source A1 PACKET switch, primary freeze + recovery
gate: G-RUNTIME
reference: A1
fixture_id: F-A1-PASS
env_prereq_id: ENV-LAB-01
runner: runners/run_reference_a1.py
depends_on: []
timeout: 300
preconditions:
  - "Channel CH01 exists, Program Master HEALTHY"
  - "Primary SDI SOURCE ACTIVE, Backup SOURCE READY"
actions:
  - step: 1
    do: "JSON-RPC switch.take({source:'PRIMARY', mode:'PACKET'})"
  - step: 2
    do: "Inject FI-01A (freeze primary 5s) via fixture F-A1-PASS"
expected:
  p50_latency_ms: 8
  p95_latency_ms: 12
  p99_latency_ms: 16
  active_source_id: "PRIMARY"
  no_black_frame: true
  no_pts_discontinuity: true
pass_rule: "active_source_id == 'PRIMARY' AND no_black_frame == true AND no_pts_discontinuity == true AND p99_latency_ms <= 20"
negative_case:
  id: AC-01-001-NEG
  do: "switch.take({source:'NONEXISTENT'})"
  expect_fail: "rejected INVALID_SOURCE, no state change"
evidence:
  - "evidence/{id}_{run_ts}_switch_log.json"
  - "evidence/{id}_{run_ts}_metrics_dump.json"
artifact_naming: "{id}_{run_ts}_{pass|fail}.json"
retry_rule:
  max: 1
  backoff_s: 30
abort_rule:
  consecutive_fail: 3
