id: HA-06-001
title: HA-06 ACTIVE HEALTHY + STANDBY FAILED → DEGRADED
gate: G-RUNTIME
reference: HA
fixture_id: F-HA-06-STANDBY-FAILED
env_prereq_id: ENV-LAB-01
runner: runners/run_fi_matrix.py
depends_on: [HA-01-001]
timeout: 300
preconditions:
  - "Active source RG HEALTHY"
  - "Standby source RG FAILED"
actions:
  - step: 1
    do: "Observe failover decision ACTIVE=HEALTHY / STANDBY=(DEGRADED|FAILED)"
expected:
  channel_health: "DEGRADED"
pass_rule: "channel_health == 'DEGRADED'"
negative_case:
  id: HA-06-001-NEG
  do: "Resolved as HEALTHY ignoring failed standby"
  expect_fail: "violates Rule 5 (STANDBY+(DEGRADED|FAILED) → DEGRADED)"
evidence:
  - "evidence/{id}_{run_ts}_ha_state.json"
artifact_naming: "{id}_{run_ts}_{pass|fail}.json"
retry_rule: {max: 0, backoff_s: 0}
abort_rule: {consecutive_fail: 1}
